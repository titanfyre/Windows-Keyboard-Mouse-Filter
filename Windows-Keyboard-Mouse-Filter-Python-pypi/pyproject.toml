[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"
[project]
name = "windows-keyboard-mouse-filter"
version = "1.0.0"
description = "Direct Windows x64 Windows-Keyboard-Mouse-Filter input SDK with native receive, edit, send, descriptors and cancellation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
[project.urls]
Repository = "https://github.com/titanfyre/Windows-Keyboard-Mouse-Filter"
Documentation = "https://github.com/titanfyre/Windows-Keyboard-Mouse-Filter/tree/main/Windows-Keyboard-Mouse-Filter-Python-pypi/docs"
[tool.setuptools]
packages = ["windows_keyboard_mouse_filter"]
[tool.setuptools.package-data]
windows_keyboard_mouse_filter = ["WindowsKeyboardMouseFilterBridge.dll"]
[tool.setuptools.data-files]
"share/doc/windows-keyboard-mouse-filter" = ["docs/API.md", "examples/info.py", "LICENSE"]
